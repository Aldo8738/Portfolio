<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2048" viewBox="0 0 4096 2048" role="img" aria-label="Seamless, restrained Berlin twilight panorama with mist and four distant landmarks">
  <!-- Taqueria Aldo / Berlin after dark.
       2:1 seamless 360 panorama. Front-facing center: x=2048, horizon ~y=1215.
       LANDMARKS: Oberbaumbruecke x~610, Fernsehturm x~1828,
       Berliner Dom x~2340, Brandenburger Tor x~2940.
       Intentionally STATIC. No Gaussian blur, turbulence, masks over large areas,
       heavy filters, volumetric fog, raster embeds or looping animations. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030d1b"/>
      <stop offset=".39" stop-color="#07162e"/>
      <stop offset=".52" stop-color="#102039"/>
      <stop offset=".585" stop-color="#1c2a42"/>
      <stop offset=".665" stop-color="#0c2037"/>
      <stop offset="1" stop-color="#030e20"/>
    </linearGradient>
    <linearGradient id="twilight" x1="0" y1=".0" x2="0" y2="1">
      <stop offset="0" stop-color="#c77a74" stop-opacity="0"/>
      <stop offset=".30" stop-color="#b36a74" stop-opacity=".04"/>
      <stop offset=".49" stop-color="#c27373" stop-opacity=".27"/>
      <stop offset=".67" stop-color="#a86273" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7a617d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warmHorizon">
      <stop offset="0" stop-color="#d58970" stop-opacity=".40"/>
      <stop offset=".45" stop-color="#b76e73" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9c5e73" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softHorizon">
      <stop offset="0" stop-color="#815f82" stop-opacity=".18"/>
      <stop offset="1" stop-color="#746787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farBuildings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243450"/>
      <stop offset="1" stop-color="#182b45"/>
    </linearGradient>
    <linearGradient id="midBuildings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112741"/>
      <stop offset="1" stop-color="#081b31"/>
    </linearGradient>
    <linearGradient id="tvTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11253e"/>
      <stop offset=".67" stop-color="#172941"/>
      <stop offset="1" stop-color="#27374f"/>
    </linearGradient>
    <radialGradient id="fogWarm">
      <stop offset="0" stop-color="#c49b8a" stop-opacity=".25"/>
      <stop offset=".35" stop-color="#a38a91" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7f7991" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogCool">
      <stop offset="0" stop-color="#8c91a4" stop-opacity=".21"/>
      <stop offset=".52" stop-color="#7b8b9f" stop-opacity=".10"/>
      <stop offset="1" stop-color="#6a829a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hazeVeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74859a" stop-opacity="0"/>
      <stop offset=".35" stop-color="#75869b" stop-opacity=".15"/>
      <stop offset=".59" stop-color="#71869c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#38516d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06172b" stop-opacity="0"/>
      <stop offset=".46" stop-color="#06172b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#030e20" stop-opacity=".99"/>
    </linearGradient>
  </defs>

  <!-- Night / blue hour. All base layers span the full circumference. -->
  <path fill="url(#sky)" d="M0 0h4096v2048H0Z"/>
  <path fill="url(#twilight)" d="M0 1010h4096v380H0Z"/>
  <!-- Glow ellipses disappear long before the left/right panorama seam. -->
  <ellipse cx="1650" cy="1181" rx="850" ry="195" fill="url(#warmHorizon)"/>
  <ellipse cx="2510" cy="1187" rx="760" ry="175" fill="url(#softHorizon)"/>
  <ellipse cx="3305" cy="1179" rx="650" ry="172" fill="url(#softHorizon)"/>

  <!-- Sparse sky, no star motion. -->
  <g fill="#ccd6e6"><circle cx="2977" cy="625" r="0.75" opacity="0.26"/>
    <circle cx="2584" cy="180" r="1.15" opacity="0.22"/>
    <circle cx="2571" cy="892" r="0.9" opacity="0.19"/>
    <circle cx="3017" cy="308" r="0.75" opacity="0.21"/>
